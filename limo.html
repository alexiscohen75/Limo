<style>
:root{
  --ivoire:#fbfaf7; --vert:#1f3d34; --or:#b09565; --encre:#1e1c19; --encre2:#2b2823;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

<script>
'use strict';
/* ================= Données de référence ================= */
var ETATS=[{v:'TB',fr:'très bon',en:'like new'},{v:'B',fr:'bon',en:'good'},{v:'EU',fr:'usage',en:'normal wear'},{v:'M',fr:'mauvais',en:'poor'}];
var ETATS_FRL={TB:'très bon état',B:'bon état',EU:'état d\u2019usage',M:'mauvais état'};
var LBL_EN={'Sol':'floor','Murs':'walls','Plafond':'ceiling','Plinthes':'skirting boards','Porte et cadre':'door and frame','Fenêtre et cadre':'window and frame','Éclairage et interrupteurs':'lighting and switches','Prises électriques':'power outlets','Radiateur · climatisation':'heating, air conditioning','Sanitaires et robinetterie':'sanitary ware and taps','Faïence et joints':'wall tiles and seals','Ventilation':'ventilation','Plan de travail et façades':'worktop and unit fronts','Évier et robinetterie':'sink and taps','Arrivées et évacuations':'water inlets and drains','Garde-corps':'railing','Éclairage extérieur':'outdoor lighting','Kitchenette : plan de travail et façades':'kitchenette, worktop and fronts'};
var APP_EN={'Lave-linge':'washing machine','Sèche-linge':'tumble dryer','Réfrigérateur':'refrigerator','Congélateur':'freezer','Four':'oven','Plaques de cuisson':'hob','Hotte':'extractor hood','Lave-vaisselle':'dishwasher','Micro-ondes':'microwave','Machine à café':'coffee machine','Télévision':'television'};
var NAT_EN={'Moquette':'carpet','Carrelage':'tiles','Plâtre peint':'painted plaster','Bois peint':'painted wood','Métal':'metal'};
var LINGE_SEED=[['Parures de lit','bed linen sets'],['Draps housses','fitted sheets'],['Housses de couette','duvet covers'],['Taies d\u2019oreiller','pillowcases'],['Serviettes de bain','bath towels'],['Tapis de bain','bath mats'],['Torchons','tea towels'],['Nappes et sets de table','tablecloths and placemats']];
var CLES_SEED=[['Jeu de clés n°1','key set 1'],['Jeu de clés n°2','key set 2'],['Badge d\u2019ascenseur','elevator badge'],['Badge ou bip de parking','parking fob'],['Clé de boîte aux lettres','mailbox key']];

function mk(label,nature){return {label:label,en:LBL_EN[label]||'',nature:nature||'',etat:null,obs:''};}
function secheSet(o){o=o||{};return [mk('Sol',o.sol),mk('Murs','Plâtre peint'),mk('Plafond','Plâtre peint'),mk('Plinthes',o.plinthes||'Bois peint'),mk('Porte et cadre','Bois peint'),mk('Fenêtre et cadre',o.fenetre||'Bois peint'),mk('Éclairage et interrupteurs',''),mk('Prises électriques',''),mk('Radiateur · climatisation','')];}
function eauSet(o){o=o||{};return secheSet({sol:o.sol||'Carrelage',plinthes:'Carrelage',fenetre:o.fenetre}).concat([mk('Sanitaires et robinetterie',''),mk('Faïence et joints',''),mk('Ventilation','')]);}
function cuisineSet(o){return secheSet(o).concat([mk('Plan de travail et façades',''),mk('Évier et robinetterie','')]);}
function buanderieSet(){return secheSet({sol:'Carrelage',plinthes:'Carrelage'}).concat([mk('Arrivées et évacuations','')]);}
function extSet(o){o=o||{};return [mk('Sol',o.sol||'Carrelage'),mk('Garde-corps','Métal'),mk('Éclairage extérieur','')];}
function appl(nom){return {nom:nom,en:APP_EN[nom]||'',marque:'',modele:'',fonctionne:null,etat:null,obs:''};}

function freshSeed(){
  var today=new Date();
  var iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  return {
    v:1,
    meta:{type:'entree',adresse:'5 rue de la Chaise, 75007 Paris',etage:'3e étage',dateEdl:iso,lieu:'Paris',exemplaires:'2',
      bailleurNom:'',bailleurQualite:'Bailleur',cursor:0,
      mentionBail:'Le présent état des lieux est établi contradictoirement entre les parties et annexé au contrat de location. Le bail prend effet le 25 août 2026 ; les clés ont été remises le 26 août 2026.'},
    locs:[{nom:'Matilda'}],
    rooms:[
      {nom:'Entrée · Dégagement',en:'Entrance hall',elements:secheSet({sol:'Moquette'}),appareils:[],mobilier:[]},
      {nom:'Buanderie',en:'Laundry room',elements:buanderieSet(),appareils:[appl('Lave-linge'),appl('Sèche-linge')],mobilier:[]},
      {nom:'WC n°1',en:'Toilet 1',elements:eauSet(),appareils:[],mobilier:[]},
      {nom:'Salle de bains',en:'Bathroom',elements:eauSet(),appareils:[],mobilier:[]},
      {nom:'Chambre n°1',en:'Bedroom 1',elements:secheSet({sol:'Moquette',fenetre:'Métal'}),appareils:[],mobilier:[]},
      {nom:'Balcon',en:'Balcony',elements:extSet({sol:'Carrelage'}),appareils:[],mobilier:[]},
      {nom:'Salon',en:'Living room',elements:secheSet({sol:'Moquette'}),appareils:[],mobilier:[]},
      {nom:'Salle d\u2019eau · WC',en:'Shower room, toilet',elements:eauSet(),appareils:[],mobilier:[]},
      {nom:'Chambre n°2 (suite)',en:'Bedroom 2 (suite)',elements:secheSet({sol:'Moquette'}).concat([mk('Kitchenette : plan de travail et façades','')]),appareils:[appl('Réfrigérateur'),appl('Plaques de cuisson'),appl('Micro-ondes')],mobilier:[]},
      {nom:'Salle de bains · WC',en:'Bathroom, toilet',elements:eauSet(),appareils:[],mobilier:[]},
      {nom:'Séjour · Cuisine',en:'Living room, kitchen',elements:cuisineSet({sol:'Moquette'}),appareils:[appl('Réfrigérateur'),appl('Congélateur'),appl('Four'),appl('Plaques de cuisson'),appl('Hotte'),appl('Lave-vaisselle'),appl('Micro-ondes'),appl('Machine à café'),appl('Télévision')],mobilier:[]},
      {nom:'Dégagement',en:'Hallway',elements:secheSet({sol:'Moquette'}),appareils:[],mobilier:[]},
      {nom:'WC n°2',en:'Toilet 2',elements:eauSet(),appareils:[],mobilier:[]}
    ],
    linge:LINGE_SEED.map(function(x){return {label:x[0],en:x[1],qte:0,etat:null,obs:''};}),
    cles:CLES_SEED.map(function(x){return {label:x[0],en:x[1],nombre:0,remis:null,obs:''};}),
    compteurs:{elecNum:'',elecIndex:'',eauNum:'',eauIndex:'',note:'Chauffage et eau chaude sanitaire collectifs (CPCU), sans comptage individuel.'},
    obsGen:'',
    photos:[],
    signatures:{bailleur:{png:null},loc1:{png:null},loc2:{png:null}}
  };
}

/* ================= Stockage ================= */
var Store={
  mode:'memory',mem:{},
  init:function(){
    try{localStorage.setItem('__edl_t','1');localStorage.removeItem('__edl_t');this.mode='local';return;}catch(e){}
    try{if(window.storage&&window.storage.get){this.mode='artifact';}}catch(e){}
  },
  get:async function(k){
    try{
      if(this.mode==='local'){var v=localStorage.getItem(k);return v==null?null:v;}
      if(this.mode==='artifact'){var r=await window.storage.get(k);return r?r.value:null;}
    }catch(e){return null;}
    return this.mem[k]!=null?this.mem[k]:null;
  },
  set:async function(k,v){
    try{
      if(this.mode==='local'){localStorage.setItem(k,v);return true;}
      if(this.mode==='artifact'){await window.storage.set(k,v);return true;}
    }catch(e){this.mem[k]=v;return false;}
    this.mem[k]=v;return true;
  },
  del:async function(k){
    try{
      if(this.mode==='local'){localStorage.removeItem(k);}
      else if(this.mode==='artifact'){await window.storage.delete(k);}
    }catch(e){}
    delete this.mem[k];
  }
};

/* IndexedDB pour les photos (mode local) */
var idb=null,idbOK=false;
function idbOpen(){return new Promise(function(res){try{
  if(!window.indexedDB){res();return;}
  var r=indexedDB.open('edl-db',1);
  r.onupgradeneeded=function(e){e.target.result.createObjectStore('photos',{keyPath:'id'});};
  r.onsuccess=function(e){idb=e.target.result;idbOK=true;res();};
  r.onerror=function(){res();};
  r.onblocked=function(){res();};
}catch(e){res();}});}
function idbPut(rec){return new Promise(function(res){if(!idbOK){res(false);return;}try{var tx=idb.transaction('photos','readwrite');tx.objectStore('photos').put(rec);tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};}catch(e){res(false);}});}
function idbDel(id){return new Promise(function(res){if(!idbOK){res();return;}try{var tx=idb.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});}
function idbAll(){return new Promise(function(res){if(!idbOK){res([]);return;}try{var tx=idb.transaction('photos','readonly');var rq=tx.objectStore('photos').getAll();rq.onsuccess=function(){res(rq.result||[]);};rq.onerror=function(){res([]);};}catch(e){res([]);}});}
function idbClear(){return new Promise(function(res){if(!idbOK){res();return;}try{var tx=idb.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});}

/* ================= État global ================= */
var state=null;
var PHOTOS={}; /* id -> dataUrl */
var cur=0;
var saveT=null,photoT=null;

function save(){clearTimeout(saveT);saveT=setTimeout(function(){Store.set('edl:state',JSON.stringify(state));},400);}
function savePhotosArtifact(){clearTimeout(photoT);photoT=setTimeout(function(){Store.set('edl:photos',JSON.stringify(PHOTOS));},800);}
async function persistPhoto(id){
  if(Store.mode==='local'&&idbOK){await idbPut({id:id,dataUrl:PHOTOS[id]});}
  else{savePhotosArtifact();}
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function getPath(p){return p.split('.').reduce(function(o,k){return o[k];},state);}
function setPath(p,v){var a=p.split('.');var o=state;for(var i=0;i<a.length-1;i++){o=o[a[i]];}o[a[a.length-1]]=v;save();}
function fmtDate(iso){try{var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}catch(e){return iso;}}
function fmtTs(ts){try{var d=new Date(ts);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

/* ================= Écrans ================= */
function screens(){
  var arr=[{t:'home'},{t:'infos'}];
  state.rooms.forEach(function(r,i){arr.push({t:'room',i:i});});
  arr.push({t:'linge'},{t:'cles'},{t:'compteurs'},{t:'obs'},{t:'sign'},{t:'recap'});
  return arr;
}
function screenTitle(s){
  if(s.t==='home')return ['Accueil','home'];
  if(s.t==='infos')return ['Informations','details'];
  if(s.t==='room')return ['Pièce '+(s.i+1)+' · '+state.rooms[s.i].nom,state.rooms[s.i].en];
  if(s.t==='linge')return ['Linge de maison','household linen'];
  if(s.t==='cles')return ['Clés et accès','keys and access'];
  if(s.t==='compteurs')return ['Relevés de compteurs','meter readings'];
  if(s.t==='obs')return ['Observations générales','general remarks'];
  if(s.t==='sign')return ['Signatures','signatures'];
  return ['Document · PDF','export'];
}
function roomDone(r){
  var d=0,t=r.elements.length+r.appareils.length;
  r.elements.forEach(function(e){if(e.etat)d++;});
  r.appareils.forEach(function(a){if(a.fonctionne||a.etat)d++;});
  return [d,t];
}

/* ---- composants ---- */
function segHtml(path,val){
  var h='<div class="seg">';
  ETATS.forEach(function(e){
    h+='<button type="button" data-act="etat" data-path="'+path+'" data-val="'+e.v+'" class="'+(val===e.v?'on':'')+'"><b>'+e.v+'</b><span>'+e.fr+'</span></button>';
  });
  return h+'</div>';
}
function togHtml(path,val,oui,non){
  return '<div class="tog">'+
    '<button type="button" data-act="tog" data-path="'+path+'" data-val="O" class="'+(val==='O'?'on':'')+'">'+oui+'</button>'+
    '<button type="button" data-act="tog" data-path="'+path+'" data-val="N" class="'+(val==='N'?'on':'')+'">'+non+'</button></div>';

function stepHtml(path,val,label){

/* ================= Rendu et navigation ================= */
function fitTa(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function render(){
  var scr=screens();var s=scr[cur];
  var tt=screenTitle(s);
  document.querySelector('#tbTitle .t1').textContent=tt[0];
  document.querySelector('#tbTitle .t2').textContent=state.meta.adresse.split(',')[0]+' · '+(cur+1)+'/'+scr.length;
  document.getElementById('navPos').textContent=(cur+1)+' / '+scr.length;
  document.getElementById('btnPrev').disabled=(cur===0);
  document.getElementById('btnNext').disabled=(cur===scr.length-1);
  var view=document.getElementById('view');
  view.innerHTML=R[s.t](s);
  view.querySelectorAll('textarea').forEach(fitTa);
  if(s.t==='sign')initSigs();
  try{window.scrollTo(0,0);}catch(e){}
}
function go(i){
  var n=screens().length;
  cur=Math.max(0,Math.min(n-1,i));
  state.meta.cursor=cur;save();
  render();
  document.getElementById('overlay').hidden=true;
}

    var tt=screenTitle(s);var st='';var todo=false;
    if(s.t==='room'){var d=roomDone(state.rooms[s.i]);st='<span class="st'+(d[0]===d[1]?' full':'')+'">'+d[0]+'/'+d[1]+'</span>';todo=(i<state.meta.cursor&&d[0]===0);}
    if(s.t==='sign'){var sg=state.signatures;var n=(sg.bailleur.png?1:0)+(sg.loc1.png?1:0)+(sg.loc2.png?1:0);st='<span class="st'+(n>=2?' full':'')+'">'+n+' sign.</span>';}
    h+='<button type="button" data-act="go" data-i="'+i+'" class="'+(todo?'todo':'')+'"><span>'+esc(tt[0])+'</span>'+st+'</button>';
  });
  document.getElementById('sommList').innerHTML=h;
  document.getElementById('overlay').hidden=false;
}

/* ================= Photos ================= */
function addPhoto(roomIdx,file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file);
    var im=new Image();
    im.onload=function(){
      try{
        var max=Store.mode==='artifact'?1024:1400;
        var w=im.naturalWidth,hh=im.naturalHeight;
        var k=Math.min(1,max/Math.max(w,hh));
        var cw=Math.round(w*k),ch=Math.round(hh*k);
        var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
        var cx=cv.getContext('2d');
        if(!cx){res();return;}
        cx.drawImage(im,0,0,cw,ch);
        var q=Store.mode==='artifact'?0.55:0.65;
        var du=cv.toDataURL('image/jpeg',q);
        var id='p'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        var ts=file.lastModified||Date.now();
        PHOTOS[id]=du;
        state.photos.push({id:id,room:roomIdx,ts:ts});
        save();persistPhoto(id);
      }catch(e){}
      URL.revokeObjectURL(url);res();
    };
    im.onerror=function(){URL.revokeObjectURL(url);res();};
    im.src=url;
  });
}

/* ================= Signatures ================= */
function initSigs(){
  document.querySelectorAll('canvas.sig').forEach(function(cv){
    var who=cv.dataset.who;
    var dpr=Math.min(2,window.devicePixelRatio||1);
    var w=cv.offsetWidth||300,h=cv.offsetHeight||170;
    cv.width=w*dpr;cv.height=h*dpr;
    var cx=cv.getContext('2d');
    if(!cx)return;
    cx.scale(dpr,dpr);
    cx.lineWidth=2.2;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1e1c19';
    var png=state.signatures[who]&&state.signatures[who].png;
    if(png){var im=new Image();im.onload=function(){cx.drawImage(im,0,0,w,h);};im.src=png;}
    var dr=false;
    function pt(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
    cv.addEventListener('pointerdown',function(e){e.preventDefault();dr=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}var p=pt(e);cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(p[0]+0.1,p[1]+0.1);cx.stroke();});
    cv.addEventListener('pointermove',function(e){if(!dr)return;e.preventDefault();var p=pt(e);cx.lineTo(p[0],p[1]);cx.stroke();});
    function end(e){if(!dr)return;dr=false;try{state.signatures[who].png=cv.toDataURL('image/png');}catch(x){}save();}
    cv.addEventListener('pointerup',end);
    cv.addEventListener('pointercancel',end);
    cv.addEventListener('pointerleave',end);
  });
}

  h+='<p class="p-small">Tout ajout hors rubriques est porté aux observations générales ou en marge de la pièce concernée, paraphé par les parties.</p>';

/* ================= Export, import, reset ================= */
function exportJson(dl){
  var json=JSON.stringify({v:1,state:state,photos:PHOTOS});
  var box=document.getElementById('expBox');
  if(box)box.value=json;
  if(dl){
    try{
      var b=new Blob([json],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='edl-sauvegarde-'+state.meta.dateEdl+'.json';
      document.body.appendChild(a);a.click();a.remove();
    }catch(e){}
  }
  return json;
}
async function importJson(txt){
  try{
    var o=JSON.parse(txt);
    if(!o||!o.state)throw 0;
    state=o.state;PHOTOS=o.photos||{};
    await Store.set('edl:state',JSON.stringify(state));
    if(Store.mode==='local'&&idbOK){await idbClear();for(var id in PHOTOS){await idbPut({id:id,dataUrl:PHOTOS[id]});}}
    else{await Store.set('edl:photos',JSON.stringify(PHOTOS));}
    go(0);
    alert('Sauvegarde importée.');
  }catch(e){alert('JSON invalide.');}
}
async function resetAll(){
  if(!confirm('Tout effacer et repartir du modèle vierge de la rue de la Chaise ?'))return;
  await Store.del('edl:state');await Store.del('edl:photos');
  if(Store.mode==='local'&&idbOK)await idbClear();
  state=freshSeed();PHOTOS={};
  go(0);
}

/* ================= Événements ================= */
function bind(){
  var view=document.getElementById('view');
  view.addEventListener('input',function(e){
    var t=e.target;
    if(t.tagName==='TEXTAREA')fitTa(t);
    var p=t.dataset.bind;
    if(p)setPath(p,t.value);
  });
  view.addEventListener('change',async function(e){
    var t=e.target;
    if(t.dataset.bind&&t.type!=='file'){setPath(t.dataset.bind,t.value);return;}
    if(t.type==='file'&&t.dataset.room!=null){
      var ri=parseInt(t.dataset.room,10);
      var files=Array.prototype.slice.call(t.files||[]);
      for(var k=0;k<files.length;k++){await addPhoto(ri,files[k]);}
      t.value='';
      render();
    }
  });
  view.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');
    if(!b)return;
    var act=b.dataset.act;
    if(act==='etat'||act==='tog'){
      var pth=b.dataset.path,val=b.dataset.val;
      var nv=getPath(pth)===val?null:val;
      setPath(pth,nv);
      var box=b.parentElement;
      box.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.val===nv);});
      return;
    }
    if(act==='step'){
      var pth2=b.dataset.path,d=parseInt(b.dataset.d,10);
      var v=Math.max(0,(parseInt(getPath(pth2),10)||0)+d);
      setPath(pth2,v);
      b.parentElement.querySelector('.num').textContent=v;
      return;
    }
    if(act==='type'){state.meta.type=b.dataset.val;save();render();return;}
    if(act==='go'){go(parseInt(b.dataset.i,10));return;}
    if(act==='menu'){openSomm();return;}
    if(act==='addEl'){state.rooms[b.dataset.room].elements.push({label:'',en:'',nature:'',etat:null,obs:'',free:true});save();render();return;}
    if(act==='addAp'){state.rooms[b.dataset.room].appareils.push({nom:'',en:'',marque:'',modele:'',fonctionne:null,etat:null,obs:'',free:true});save();render();return;}
    if(act==='addMb'){state.rooms[b.dataset.room].mobilier.push({label:'',qte:1,etat:null,obs:''});save();render();return;}
    if(act==='addLg'){state.linge.push({label:'',en:'',qte:0,etat:null,obs:'',free:true});save();render();return;}
    if(act==='addCl'){state.cles.push({label:'',en:'',nombre:0,remis:null,obs:'',free:true});save();render();return;}
    if(act==='addloc'){if(state.locs.length<2){state.locs.push({nom:''});save();render();}return;}
    if(act==='delloc'){if(state.locs.length>1){state.locs.pop();state.signatures.loc2.png=null;save();render();}return;}
    if(act==='del'){
      if(!confirm('Supprimer cette ligne ?'))return;
      getPath(b.dataset.arr).splice(parseInt(b.dataset.i,10),1);
      save();render();return;
    }
    if(act==='delphoto'){
      if(!confirm('Supprimer cette photo ?'))return;
      var id=b.dataset.id;
      state.photos=state.photos.filter(function(p){return p.id!==id;});
      delete PHOTOS[id];
      save();
      if(Store.mode==='local'&&idbOK)idbDel(id);else savePhotosArtifact();
      render();return;
    }
    if(act==='sigclear'){
      var who=b.dataset.who;
      state.signatures[who].png=null;save();
      var cv=view.querySelector('canvas.sig[data-who="'+who+'"]');
      if(cv){var cx=cv.getContext('2d');if(cx)cx.clearRect(0,0,cv.width,cv.height);}
      return;
    }
    if(act==='print'){buildPrint();setTimeout(function(){try{window.print();}catch(e){alert('Impression bloquée ici : utilisez le bouton de téléchargement du document.');}},80);return;}
    if(act==='dldoc'){downloadDoc();return;}
    if(act==='export'){exportJson(true);return;}
    if(act==='copyexp'){
      var json=exportJson(false);
      var box=document.getElementById('expBox');
      box.focus();box.select();
      try{navigator.clipboard.writeText(json);}catch(e){try{document.execCommand('copy');}catch(x){}}
      return;
    }
    if(act==='import'){importJson(document.getElementById('expBox').value);return;}
    if(act==='reset'){resetAll();return;}
  });
  document.getElementById('btnPrev').addEventListener('click',function(){go(cur-1);});
  document.getElementById('btnNext').addEventListener('click',function(){go(cur+1);});
  document.getElementById('navPos').addEventListener('click',openSomm);
  document.getElementById('btnMenu').addEventListener('click',openSomm);
  document.getElementById('overlay').addEventListener('click',function(e){
    var b=e.target.closest('[data-act="go"]');
    if(b){go(parseInt(b.dataset.i,10));return;}
    if(e.target.id==='overlay')e.target.hidden=true;
  });
  window.addEventListener('beforeprint',buildPrint);
}

/* ================= Initialisation ================= */
async function init(){
  Store.init();
  if(Store.mode==='local')await idbOpen();
  var raw=await Store.get('edl:state');
  if(raw){try{state=JSON.parse(raw);}catch(e){state=null;}}
  if(!state)state=freshSeed();
  if(Store.mode==='local'&&idbOK){
    var recs=await idbAll();
    recs.forEach(function(r){PHOTOS[r.id]=r.dataUrl;});
  }else{
    var pr=await Store.get('edl:photos');
    if(pr){try{PHOTOS=JSON.parse(pr)||{};}catch(e){PHOTOS={};}}
  }
  state.photos=(state.photos||[]).filter(function(p){return PHOTOS[p.id];});
  bind();
  go(state.meta.cursor||0);
}
window.App={go:function(i){go(i);},count:function(){return screens().length;},buildPrint:buildPrint,mode:function(){return Store.mode;}};
init();
